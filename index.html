<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SeaQuest Command Center</title>
<meta name="theme-color" content="#0a0e14" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
:root{
  --bg:#0a0e14; --bg2:#0e131c; --panel:#121a26; --panel2:#18222f; --line:#233043;
  --tx:#e7eef7; --dim:#8aa0b6; --dim2:#5f7183;
  --teal:#00e0a4; --blue:#2f80ed; --gold:#ffd23f; --red:#ff4d4f; --green:#22c58b; --purple:#b37feb; --orange:#ff7a45;
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{background:
  radial-gradient(1200px 600px at 80% -10%, rgba(0,224,164,.07), transparent),
  radial-gradient(900px 500px at -10% 10%, rgba(47,128,237,.08), transparent),
  var(--bg);min-height:100vh}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 96px}
/* Header */
header{position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);
  background:linear-gradient(180deg,rgba(10,14,20,.95),rgba(10,14,20,.78));border-bottom:1px solid var(--line)}
.hbar{max-width:1080px;margin:0 auto;padding:9px 16px 4px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--blue));
  display:grid;place-items:center;color:#04121a;font-weight:900;box-shadow:0 0 18px rgba(0,224,164,.35)}
.logo b{font-size:15px}.logo span{font-size:9px;color:var(--dim);display:block;font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
.cloud{margin-left:auto;font-size:9px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;cursor:pointer}
.cloud.on{color:var(--teal);border-color:rgba(0,224,164,.4)}
/* Console (top game HUD) */
.console{max-width:1080px;margin:0 auto;padding:2px 16px 9px}
.me-row{display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  border:1px solid var(--line);border-radius:14px;padding:9px 11px;cursor:pointer;transition:.15s}
.me-row:active{transform:scale(.995)}
.ava{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:21px;position:relative;flex:0 0 auto;border:2px solid;background:#0e1723}
.ava .lvl{position:absolute;right:-7px;bottom:-7px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:9px;font-weight:900;padding:1px 5px;color:var(--tx);line-height:1.3}
.me-info{flex:1;min-width:0}
.me-info .nm{font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px}
.me-info .rl{font-size:10px;color:var(--dim);margin-top:1px}
.xpwrap{margin-top:6px}
.xpbar{height:6px;border-radius:5px;background:#0c1420;border:1px solid var(--line);overflow:hidden}
.xpbar>i{display:block;height:100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.xp-lab{display:flex;justify-content:space-between;font-size:9px;color:var(--dim2);margin-top:3px;font-variant-numeric:tabular-nums}
.swap{font-size:16px;color:var(--dim);flex:0 0 auto;padding:0 2px}
/* Global meter */
.gmeter{padding-top:10px}
.gmeter .track{height:9px;border-radius:6px;overflow:hidden;position:relative;border:1px solid var(--line);
  background:repeating-linear-gradient(90deg,transparent,transparent calc(10% - 1px),rgba(255,255,255,.07) 10%),#0c1420}
.gmeter .fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 14px rgba(0,224,164,.55)}
.gmeter .lab{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin:6px 2px 0}
.gmeter .lab b{color:var(--teal)}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:10px;padding:4px 9px;border-radius:20px;background:#0e1723;border:1px solid var(--line);color:var(--dim);font-weight:700;display:flex;gap:5px;align-items:center}
.chip b{color:var(--tx)}
/* Nav */
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  padding:9px 14px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
nav button.on{color:#04121a;background:linear-gradient(135deg,var(--teal),#3fe0c0);border-color:transparent;box-shadow:0 4px 16px rgba(0,224,164,.25)}
nav button:active{transform:scale(.97)}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.subtabs button.on{color:#04121a;background:var(--teal);border-color:transparent}
.subtabs button:active{transform:scale(.96)}
/* Cards & panels */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
h2.sec{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:22px 4px 10px;font-weight:800;display:flex;align-items:center;gap:8px}
h2.sec .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal)}
/* Stat tiles */
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px}
.stat .n{font-size:24px;font-weight:900;line-height:1}
.stat .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:5px;font-weight:700}
.stat .sub{font-size:11px;color:var(--dim2);margin-top:3px}
/* progress bar */
.bar{height:7px;border-radius:5px;background:#0c1420;overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;border-radius:5px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.barlab{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px;color:var(--dim)}
.barlab b{color:var(--tx)}
/* rows */
.rrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border:none}
.rrow .flag{font-size:18px;width:24px;text-align:center}
.rrow .nm{font-weight:700;font-size:13px;min-width:118px}
.rrow .bwrap{flex:1}
.rrow .pc{font-size:11px;color:var(--dim);width:74px;text-align:right;font-variant-numeric:tabular-nums}
/* Squad */
.rep{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px}
.rep.me{border-color:rgba(0,224,164,.55);box-shadow:0 0 0 1px rgba(0,224,164,.12)}
.rep .info{flex:1;min-width:0}
.rep .rn{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.rep .rm{font-size:10px;color:var(--dim)}
.rep .youtag{font-size:8px;background:var(--teal);color:#04121a;padding:1px 6px;border-radius:10px;font-weight:900;letter-spacing:.5px}
.rep .rbtns{display:flex;gap:6px;margin-top:8px}
.mini-btn{font-size:10px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer;font-weight:700}
.mini-btn.on{color:#04121a;background:var(--teal);border-color:transparent}
/* US map */
.maprow{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.tile{position:relative;aspect-ratio:1/1;border-radius:8px;border:1px solid var(--line);background:#111a25;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s;padding:2px;min-height:0}
.tile:hover{transform:translateY(-2px);border-color:var(--teal)}
.tile .ab{font-size:11px;font-weight:900;letter-spacing:.3px}
.tile .mini{position:absolute;bottom:3px;left:4px;right:4px;height:3px;border-radius:3px;background:#0a1019;overflow:hidden}
.tile .mini > i{display:block;height:100%}
.tile .badge{position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;border-radius:8px;background:var(--teal);color:#04121a;font-size:9px;font-weight:900;display:grid;place-items:center;padding:0 3px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:10px;color:var(--dim);margin-top:12px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* Frontier cards */
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;transition:.15s}
.fcard:hover{border-color:var(--teal);transform:translateY(-2px)}
.fcard .top{display:flex;align-items:center;gap:9px}
.fcard .fl{font-size:22px}
.fcard .nm{font-weight:800;font-size:14px}
.fcard .nt{font-size:10px;color:var(--dim2)}
/* company card */
.unit{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;transition:.15s}
.unit .u-top{display:flex;align-items:flex-start;gap:8px}
.unit .u-nm{font-weight:800;font-size:14px;line-height:1.2}
.unit .u-meta{font-size:11px;color:var(--dim);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.ind{border-color:transparent;color:#04121a;font-weight:700}
.terrpill{font-size:10px;padding:2px 7px;border-radius:6px;background:#0e1723;border:1px solid var(--line);color:var(--dim);font-weight:700}
.owner{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);cursor:pointer;white-space:nowrap;font-weight:700}
.callbtn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--teal);text-decoration:none;font-weight:800;
  border:1px solid rgba(0,224,164,.35);background:rgba(0,224,164,.09);padding:8px 12px;border-radius:10px}
.callbtn:active{transform:scale(.97)}
.nocall{margin-top:8px;font-size:11px;color:var(--dim);display:inline-flex;gap:6px;align-items:center}
/* stage stepper */
.steps{display:flex;gap:4px;margin-top:11px}
.step{flex:1;height:26px;border-radius:7px;background:#0c1420;border:1px solid var(--line);display:grid;place-items:center;
  font-size:9px;font-weight:800;color:var(--dim2);cursor:pointer;transition:.15s;text-align:center;line-height:1;padding:2px}
.step.done{color:#04121a}
.step:hover{border-color:var(--teal)}
.u-actions{display:flex;gap:6px;margin-top:9px}
.btn{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);
  font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.adv{background:linear-gradient(135deg,var(--teal),#37d9bb);color:#04121a;border-color:transparent}
.btn.rej{background:rgba(255,77,79,.12);color:var(--red);border-color:rgba(255,77,79,.35)}
.btn.win{background:linear-gradient(135deg,var(--gold),#ffb800);color:#3a2a00;border-color:transparent}
.btn.sm{flex:0 0 auto;padding:8px 12px}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{background:var(--panel);border:1px solid var(--line);color:var(--tx);
  padding:9px 11px;border-radius:10px;font-size:13px;font-weight:600}
.filters input{flex:1;min-width:130px}
/* sector card */
.sec-card .sc-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.sec-card .sc-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:#0e1723;border:1px solid var(--line)}
.sec-card .sc-nm{font-weight:800;font-size:14px}
.sec-card .sc-sub{font-size:11px;color:var(--dim)}
/* toast */
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--panel2);border:1px solid var(--teal);color:var(--tx);padding:11px 18px;border-radius:12px;
  font-size:13px;font-weight:700;z-index:90;transition:.35s;box-shadow:var(--shadow);pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(4,8,14,.72);backdrop-filter:blur(4px);z-index:80;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:1080px;padding:18px;max-height:88vh;overflow:auto}
.modal h3{margin:0 0 4px;font-size:18px}
.field{margin-top:12px}
.field label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.field input,.field select,.field textarea{width:100%;margin-top:5px;background:var(--bg2);border:1px solid var(--line);
  color:var(--tx);padding:11px;border-radius:10px;font-size:14px;font-family:inherit}
.pick{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:12px;margin-top:9px;cursor:pointer;transition:.15s}
.pick:hover{border-color:var(--teal)}
.pick.on{border-color:var(--teal);background:rgba(0,224,164,.06)}
.crumb{font-size:12px;color:var(--dim);margin:14px 4px 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.crumb:hover{color:var(--teal)}
.terrhead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.terrhead .big{font-size:26px;font-weight:900}
.ghost{opacity:.5;font-size:11px;color:var(--dim2);font-style:italic}
.empty{text-align:center;color:var(--dim2);padding:30px 10px;font-size:13px}
.fab{position:fixed;right:18px;bottom:78px;width:54px;height:54px;border-radius:16px;border:none;z-index:50;
  background:linear-gradient(135deg,var(--teal),var(--blue));color:#04121a;font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 8px 24px rgba(0,224,164,.4)}
/* card action buttons */
.uacts2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ib{flex:1;min-width:70px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:800;
  padding:9px 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);cursor:pointer;text-decoration:none}
.ib:active{transform:scale(.97)}
.ib.call{color:var(--teal);border-color:rgba(0,224,164,.35);background:rgba(0,224,164,.09)}
.ib.mail{color:#8fc0ff;border-color:rgba(47,128,237,.35);background:rgba(47,128,237,.10)}
.ib.edit{color:var(--dim)}
.contactline{font-size:11px;color:var(--dim);margin-top:7px;display:flex;flex-direction:column;gap:2px}
.hint{font-size:10px;color:var(--dim2);margin-top:5px;line-height:1.35}
/* template / email */
.tpl{white-space:pre-wrap;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;line-height:1.5;color:var(--tx);margin-top:8px;max-height:210px;overflow:auto}
/* character sheet */
.charhead{display:flex;align-items:center;gap:14px}
.charhead .big{font-size:22px;font-weight:900}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stmini{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stmini .v{font-size:18px;font-weight:900}.stmini .k{font-size:9px;color:var(--dim2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.badge2{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.badge2.lock{opacity:.38}
.badge2 .bi{font-size:22px;flex:0 0 auto}
.badge2 .bt{font-weight:800;font-size:12px}.badge2 .bd{font-size:10px;color:var(--dim)}
/* minigame */
.pitch-bar{position:relative;height:46px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#0c1420;margin-top:14px;cursor:pointer}
.pitch-zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,rgba(34,197,139,.22),rgba(0,224,164,.33),rgba(34,197,139,.22))}
.pitch-bull{position:absolute;top:0;bottom:0;background:rgba(255,210,63,.55)}
.pitch-marker{position:absolute;top:-3px;bottom:-3px;width:4px;background:#fff;box-shadow:0 0 10px #fff;border-radius:2px}
@media(max-width:640px){
  .g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}
  .maprow{gap:3px}.tile .ab{font-size:9px}
  .rrow .nm{min-width:92px;font-size:12px}
}
@media(max-width:400px){.g2{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}.badges{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="logo"><div class="mark">S</div><div><b>SeaQuest</b><span>Command Center</span></div></div>
    <div class="cloud" id="cloudChip">local mode</div>
  </div>
  <div class="console">
    <div class="me-row" id="meRow" onclick="openMe()"></div>
    <div class="gmeter">
      <div class="track"><div class="fill" id="gfill"></div></div>
      <div class="lab"><span>Global Domination</span><span><b id="gpct">0%</b> of <span id="gpool">0</span> targets</span></div>
      <div class="chips" id="chips"></div>
    </div>
  </div>
  <div class="wrap" style="padding-bottom:0"><nav id="nav"></nav></div>
</header>

<main class="wrap"><div id="app"></div></main>

<button class="fab" id="fab" title="Add company">+</button>
<div id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script>
/* ============================ SeaQuest Command Center ============================ */
const CFG=window.SEAQUEST_CONFIG||{};
const INDUSTRIES=window.SEAQUEST_INDUSTRIES||[];
const STAGES=window.SEAQUEST_STAGES||[];
const REJ=window.SEAQUEST_REJECTED;
const STATES=window.SEAQUEST_STATES||[];
const FRONTIER=window.SEAQUEST_FRONTIER||[];
const US_POOL=window.SEAQUEST_US_POOL||4000;
const SEED=window.SEAQUEST_SEED||[];
const REPS=window.SEAQUEST_REPS||[{id:"me",name:"Me",role:"Commander",market:"",emoji:"⭐",color:"#ffd23f"}];

const STATE_BY_AB={}; STATES.forEach(s=>STATE_BY_AB[s.ab]=s);
const US_AB_SET=new Set(STATES.map(s=>s.ab));
const IND_BY_KEY={}; INDUSTRIES.forEach(i=>IND_BY_KEY[i.key]=i);
const STAGE_IDX={}; STAGES.forEach((s,i)=>STAGE_IDX[s.key]=i);
const REP_BY_ID={}; REPS.forEach(r=>REP_BY_ID[r.id]={...r});
const SUM_POP=STATES.reduce((a,s)=>a+s.pop,0);
const GLOBAL_POOL=US_POOL+FRONTIER.reduce((a,f)=>a+f.pool,0);

const RANKS=[
  {n:"Recruit",x:0},{n:"Scout",x:120},{n:"Field Operator",x:400},{n:"Closer",x:1000},
  {n:"Regional Boss",x:2200},{n:"Continental Command",x:4500},{n:"Global Overlord",x:9000}
];

let sb=null;
const S={view:'command',companies:[],cloud:false,session:null,me:REPS[0].id,
  terr:null, terrTab:'all', terrSector:null, hitAll:false, repId:null, filter:{terr:null,industry:null,stage:null,owner:null,q:''}};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=x=>(x==null?'':String(x)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
function fmtPct(p){ if(p>=10)return p.toFixed(0)+'%'; if(p>=1)return p.toFixed(1)+'%'; if(p>=0.01)return p.toFixed(2)+'%'; if(p>0)return p.toFixed(4)+'%'; return '0%'; }
function timeAgo(t){const s=Math.floor((Date.now()-t)/1000);if(s<60)return 'just now';const m=Math.floor(s/60);if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}

function deriveStage(status){
  const s=(status||'').toLowerCase();
  if(/\bwon\b|customer|closed win|ordered|purchase order/.test(s)) return 'won';
  if(/calling|in conversation|engaged|replied|responded|meeting|quote sent|quoting|call scheduled|demo/.test(s)) return 'convo';
  if(/email|message sent|invite sent|linkedin|vm |voicemail|dm |reached|contacted|sent/.test(s)) return 'reached';
  if(/to call|ready|has contact|named|warm/.test(s)) return 'researched';
  if(/research|need contact|prospect|to research/.test(s)) return 'prospect';
  return 'researched';
}
function isRejected(status){ return /reject|declin|lost|not interested|no interest/.test((status||'').toLowerCase()); }
function statusForStage(k){return ({prospect:'Prospect',researched:'Researched',reached:'Reached out',convo:'In conversation',won:'Won'})[k]||'Researched';}
function telHref(phone){ if(!phone)return null; const m=String(phone).match(/\+?\d[\d\s().\-]{6,}\d/); if(!m)return null; let num=m[0].replace(/[^\d+]/g,''); if(num.replace(/\D/g,'').length<7)return null; return 'tel:'+num; }
function prettyTel(tel){let n=tel.replace('tel:','');const d=n.replace(/\D/g,'');if(d.length===10)return '('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6);if(d.length===11&&d[0]==='1')return '1 ('+d.slice(1,4)+') '+d.slice(4,7)+'-'+d.slice(7);return n;}

/* ---------- geo parsing ---------- */
function parseGeo(loc){
  if(!loc) return {terr:'Unassigned',region:'HQ / National',kind:'na'};
  let s=String(loc).replace(/\(.*?\)/g,' ').replace(/\barea\b/ig,' ').replace(/\bHQ\b/ig,' ').trim();
  const low=s.toLowerCase();
  if(/ghana|nigeria|kenya|egypt|africa/.test(low)) return {terr:'Rest of World',region:'Rest of World',kind:'country'};
  if(/uae|dubai|abu dhabi|saudi|qatar|oman|kuwait|bahrain/.test(low)) return {terr:'Rest of World',region:'Rest of World',kind:'country'};
  if(/india|china|japan|korea|singapore|australia|brazil|argentina|chile/.test(low)) return {terr:'Rest of World',region:'Rest of World',kind:'country'};
  if(/toronto|vancouver|montreal|calgary|ottawa|edmonton|winnipeg|,\s*canada|\bcanada\b|,\s*on\b|,\s*qc\b|,\s*bc\b|,\s*ab\b/.test(low)) return {terr:'Canada',region:'Canada',kind:'country'};
  if(/mexico|guadalajara|monterrey|tijuana|cdmx|puebla/.test(low)) return {terr:'Mexico',region:'Mexico',kind:'country'};
  if(/london|manchester|birmingham|united kingdom|,\s*uk\b|england|scotland|,\s*gb\b/.test(low)) return {terr:'United Kingdom',region:'United Kingdom',kind:'country'};
  if(/germany|france|spain|italy|netherlands|poland|portugal|ireland|belgium|sweden|,\s*eu\b/.test(low)) return {terr:'European Union',region:'European Union',kind:'country'};
  let parts=s.split(/[,/]/).map(x=>x.trim()).filter(Boolean);
  let tok=parts.length?parts[parts.length-1]:s;
  if(/united states|u\.s\.|usa|^us$/i.test(tok)&&parts.length>=2) tok=parts[parts.length-2];
  let m=tok.match(/\b([A-Za-z]{2})\b/);
  let ab=m?m[1].toUpperCase():null;
  if(ab&&US_AB_SET.has(ab)) return {terr:ab,region:'United States',kind:'state'};
  const byName=STATES.find(st=>low.includes(st.name.toLowerCase()));
  if(byName) return {terr:byName.ab,region:'United States',kind:'state'};
  return {terr:'Unassigned',region:'HQ / National',kind:'na'};
}
function defaultOwner(region){
  if(region==='Mexico')return 'mx';
  if(region==='European Union'||region==='United Kingdom')return 'eu';
  if(region==='Rest of World')return 'xiaoke';
  return REPS[0].id;
}

/* ---------- targets ---------- */
function stateTarget(ab){const st=STATE_BY_AB[ab];if(!st)return 0;return Math.max(8,Math.round(US_POOL*st.pop/SUM_POP));}
function territoryTarget(kind,key){
  if(kind==='state')return stateTarget(key);
  const f=FRONTIER.find(f=>f.key===key);if(f)return f.pool;
  if(key==='Unassigned')return 200; return 100;
}

const QUESTS=[
  {key:'calls',   label:'Dial 5 prospects',   goal:5, xp:40, icon:'\u{1F4DE}'},

function today(){return new Date().toISOString().slice(0,10);}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}
function loadQuests(){
  let q;try{q=JSON.parse(localStorage.getItem('sq_quests')||'null');}catch(e){q=null;}
  if(!q)q={date:today(),prog:{},claimed:{},streak:0,dayCounted:''};
  if(q.date!==today()){ if(q.dayCounted!==yesterday())q.streak=0; q.date=today();q.prog={};q.claimed={};q.dayCounted=''; saveQuests(q); }
  return q;
}
function saveQuests(q){try{localStorage.setItem('sq_quests',JSON.stringify(q))}catch(e){}}
function bumpQuest(key,n){
  const q=loadQuests();q.prog[key]=(q.prog[key]||0)+(n||1);
  QUESTS.filter(Q=>Q.key===key).forEach(Q=>{
    if(!q.claimed[Q.key]&&q.prog[Q.key]>=Q.goal){
      q.claimed[Q.key]=true; addTrainingXP(S.me,Q.xp);
      if(q.dayCounted!==today()){q.streak=(q.streak||0)+1;q.dayCounted=today();}
      setTimeout(()=>{toast(`${Q.icon} Quest complete: ${Q.label}  +${Q.xp} XP`);},250);
    }
  });
  saveQuests(q);
}

/* ---------- model ---------- */
function extractEmail(){const s=Array.prototype.filter.call(arguments,Boolean).join(' ');const m=s.match(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/);return m?m[0]:'';}
function pick(a,b){return (a!=null&&a!=='')?a:(b!=null?b:'');}
function buildModel(list){
  const ov=loadOv();const owners=ov.owners||{};const edits=ov.edits||{};
  return list.map(raw=>{
    const e=edits[raw.name]||{};
    const industry=pick(e.industry,raw.industry)||'Prospecting / Other';
    const location=pick(e.location,raw.location);
    const phone=pick(e.phone,raw.phone);
    const notes=pick(e.notes,raw.notes);
    const contact=pick(e.contact,raw.contact);
    const title=pick(e.title,raw.title);
    const nextStep=pick(e.nextStep,raw.nextStep);
    const email=pick(e.email,raw.email)||extractEmail(notes,phone);
    const geo=parseGeo(location);
    const rej=(typeof raw._rejected==='boolean')?raw._rejected:isRejected(raw.status);
    const owner=owners[raw.name]||raw.owner||defaultOwner(geo.region);
    return {id:raw.id,name:raw.name,industry,location,status:raw.status,phone,email,contact,title,notes,nextStep,
      geo,rejected:rej,stage:deriveStage(raw.status),owner};
  });
}
function localList(){
  const ov=loadOv();
  let list=SEED.map(x=>({...x}));
  list.forEach(c=>{const o=ov.byName[c.name];if(o){c.status=o.status;c._rejected=o.rejected;}});
  (ov.added||[]).forEach(a=>{const o=ov.byName[a.name];list.push(o?{...a,status:o.status,_rejected:o.rejected}:{...a});});
  return list;
}

/* ---------- cloud ---------- */
async function initCloud(){
  if(!window.supabase||!CFG.url||!/^http/.test(CFG.url))return;
  try{ sb=window.supabase.createClient(CFG.url,CFG.anonKey);
    const {data}=await sb.auth.getSession();
    if(data&&data.session){S.cloud=true;S.session=data.session;}
  }catch(e){sb=null;}
}
async function reload(){
  if(S.cloud&&sb){
    try{const {data,error}=await sb.from('companies').select('*').order('name');
      if(!error&&data){S.companies=buildModel(data.map(r=>({id:r.id,name:r.name,industry:r.industry,location:r.location,status:r.status,phone:r.phone_channel,notes:r.notes})));return;}
    }catch(e){}
  }
  S.companies=buildModel(localList());
}
async function writeStage(c,stageKey,rejected){
  const status=rejected?'Rejected':statusForStage(stageKey);
  if(S.cloud&&sb&&c.id){try{await sb.from('companies').update({status,updated_at:new Date().toISOString()}).eq('id',c.id);}catch(e){}}
  else{const ov=loadOv();ov.byName[c.name]={status,rejected:!!rejected};saveOv(ov);}
  c.status=status;c.rejected=!!rejected;c.stage=rejected?c.stage:stageKey;
}
async function addCompany(o){
  o.owner=o.owner||S.me;
  if(S.cloud&&sb){try{await sb.from('companies').insert({name:o.name,industry:o.industry,location:o.location,status:o.status,notes:o.notes,phone_channel:o.phone});}catch(e){}}
  else{const ov=loadOv();ov.added=ov.added||[];ov.added.push(o);saveOv(ov);}
  const ov=loadOv();ov.owners=ov.owners||{};ov.owners[o.name]=o.owner;saveOv(ov);
  await reload();
}
function setOwner(idx,id){
  const c=S.companies[idx];if(!c)return;
  const ov=loadOv();ov.owners=ov.owners||{};ov.owners[c.name]=id;saveOv(ov);
  c.owner=id;closeModal();render();toast(esc(c.name)+' → '+REP_BY_ID[id].name);
}

/* ---------- metrics & XP ---------- */
function metricsFor(companies){
  let m={known:companies.length,prospect:0,researched:0,reached:0,convo:0,won:0,rejected:0,contacted:0};
  companies.forEach(c=>{ if(c.rejected){m.rejected++;return;} m[c.stage]=(m[c.stage]||0)+1; if(STAGE_IDX[c.stage]>=STAGE_IDX.reached)m.contacted++; });
  return m;
}
function score(m){return m.researched*5+m.reached*20+m.convo*45+m.won*150+m.rejected*4;}
function rankFor(x){let r=RANKS[0],nx=null;for(let i=0;i<RANKS.length;i++){if(x>=RANKS[i].x){r=RANKS[i];nx=RANKS[i+1]||null;}}return{r,nx};}
function repXP(id){return score(metricsFor(S.companies.filter(c=>c.owner===id)))+(repStat(id).xp||0);}
function levelInfo(xp){let lvl=1,need=200,rem=xp;while(rem>=need){rem-=need;lvl++;need=Math.round(need*1.35);}return{level:lvl,into:rem,need,pct:need?rem/need:0};}

/* ---------- colors ---------- */
function terrColor(m,target){
  if(m.known===0)return{bg:'#111a25',bd:'#233043',fg:'#3f4f60',fill:'#233043'};
  const ctrl=target?Math.min(1,m.contacted/target):0;
  if(m.won>0)return{bg:'rgba(255,210,63,.14)',bd:'rgba(255,210,63,.55)',fg:'#ffd23f',fill:'#ffd23f'};
  if(m.contacted>0){const a=.14+ctrl*.5;return{bg:'rgba(34,197,139,'+a.toFixed(2)+')',bd:'rgba(34,197,139,.6)',fg:'#7ff0c4',fill:'#22c58b'};}
  if(m.rejected>0)return{bg:'rgba(255,77,79,.13)',bd:'rgba(255,77,79,.5)',fg:'#ff8f90',fill:'#ff4d4f'};
  return{bg:'rgba(47,128,237,.13)',bd:'rgba(47,128,237,.5)',fg:'#8fc0ff',fill:'#2f80ed'};
}
function byTerr(){const g={};S.companies.forEach(c=>{(g[c.geo.terr]=g[c.geo.terr]||[]).push(c);});return g;}
function byRegion(){const g={};S.companies.forEach(c=>{(g[c.geo.region]=g[c.geo.region]||[]).push(c);});return g;}

    ${statTile(contactedTerr.size,'Territories','with a foothold','var(--blue)',"go('map')")}
    ${statTile(M.rejected,'Resisted','rejections','var(--red)',"stageBoard('rejected')")}
    ${statTile(M.researched+M.prospect,'Backlog','not yet contacted','var(--dim)',"stageBoard('backlog')")}
    ${statTile(fmtPct(M.contacted/GLOBAL_POOL*100),'World','domination','var(--teal)',"go('map')")}
  </div>`;

  /* THEATERS */
  h+=`<h2 class="sec"><span class="dot"></span>Theaters of Operation</h2><div class="panel">`;
  regionOrder.forEach(rg=>{
    const m=metricsFor(regions[rg]||[]);
    let target = rg==='United States'?US_POOL : (rg==='HQ / National'?200 : ((FRONTIER.find(f=>f.key===rg)||{}).pool||100));
    const pc=target?m.contacted/target*100:0;
    const flag=rg==='United States'?'\u{1F1FA}\u{1F1F8}':(FRONTIER.find(f=>f.key===rg)||{}).flag||'\u{1F3E2}';
    const col=m.contacted>0?'var(--green)':(m.known>0?'var(--blue)':'var(--line)');

    h+=`<div class="rrow" ${click}><div class="flag">${flag}</div><div class="nm">${rg}</div>
      <div class="bwrap"><div class="bar"><i style="width:${Math.max(pc,m.contacted>0?2:0).toFixed(1)}%;background:${col}"></i></div>
      <div style="font-size:10px;color:var(--dim2);margin-top:3px">${m.known} known &middot; ${m.contacted} contacted &middot; ~${target.toLocaleString()} est. targets</div></div>
      <div class="pc">${fmtPct(pc)}</div></div>`;
  });
  h+=`</div>`;

  const frontierEmpty=FRONTIER.filter(f=>metricsFor(regions[f.key]||[]).contacted===0);
  if(frontierEmpty.length){
    h+=`<h2 class="sec"><span class="dot"></span>Expansion Frontier</h2>
    <div style="font-size:12px;color:var(--dim);margin:-4px 4px 10px">Untouched theaters - first mover advantage.</div><div class="grid g3">`;
    frontierEmpty.forEach(f=>{h+=`<div class="fcard" onclick="openCountry('${f.key}')">
      <div class="top"><div class="fl">${f.flag}</div><div><div class="nm">${f.key}</div><div class="nt">${f.note}</div></div></div>
      <div style="margin-top:10px" class="bar"><i style="width:0%"></i></div>
      <div style="font-size:11px;color:var(--dim2);margin-top:6px">~${f.pool.toLocaleString()} est. targets &middot; 0 contacted</div></div>`;});
    h+=`</div>`;
  }
  const acts=loadActs();
  if(acts.length){
    h+=`<h2 class="sec"><span class="dot"></span>Recent Activity</h2><div class="panel">`;
    acts.slice(0,8).forEach(a=>{const rep=REP_BY_ID[a.who]||{emoji:'\u{1F464}'};
      h+=`<div class="rrow"><div class="flag">${rep.emoji}</div><div style="flex:1;font-size:12px">${esc(a.text)}</div><div style="font-size:10px;color:var(--dim2);white-space:nowrap">${timeAgo(a.t)}</div></div>`;});
    h+=`</div>`;
  }
  $('#app').innerHTML=h;
}

/* ---------- Pipeline ---------- */
function viewPipeline(){
  const f=S.filter;
  let list=S.companies.slice();
  if(f.industry)list=list.filter(c=>c.industry===f.industry);
  if(f.owner)list=list.filter(c=>c.owner===f.owner);
  if(f.stage){
    if(f.stage==='rejected')list=list.filter(c=>c.rejected);
    else if(f.stage==='contacted')list=list.filter(c=>!c.rejected&&STAGE_IDX[c.stage]>=STAGE_IDX.reached);
    else if(f.stage==='backlog')list=list.filter(c=>!c.rejected&&STAGE_IDX[c.stage]<STAGE_IDX.reached);
    else list=list.filter(c=>!c.rejected&&c.stage===f.stage);
  }
  if(f.terr)list=list.filter(c=>c.geo.terr===f.terr);
  if(f.q){const q=f.q.toLowerCase();list=list.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.location||'').toLowerCase().includes(q)||(c.industry||'').toLowerCase().includes(q));}
  list.sort((a,b)=>STAGE_IDX[b.stage]-STAGE_IDX[a.stage]||(a.name||'').localeCompare(b.name||''));
  let h=`<h2 class="sec"><span class="dot"></span>Pipeline &mdash; ${list.length} units</h2>`;
  h+=`<div class="filters">
    <input id="fq" placeholder="Search company, city, sector..." value="${esc(f.q)}" oninput="S.filter.q=this.value;debounceP()">
    <select onchange="S.filter.owner=this.value||null;render()"><option value="">All reps</option>${REPS.map(r=>`<option value="${r.id}" ${f.owner===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select>
    <select onchange="S.filter.industry=this.value||null;render()"><option value="">All sectors</option>${INDUSTRIES.map(i=>`<option ${f.industry===i.key?'selected':''}>${i.key}</option>`).join('')}</select>
    <select onchange="S.filter.stage=this.value||null;render()"><option value="">All stages</option>${STAGES.map(s=>`<option value="${s.key}" ${f.stage===s.key?'selected':''}>${s.label}</option>`).join('')}<option value="contacted" ${f.stage==='contacted'?'selected':''}>Contacted (any)</option><option value="backlog" ${f.stage==='backlog'?'selected':''}>Backlog</option><option value="rejected" ${f.stage==='rejected'?'selected':''}>Rejected</option></select>
  </div>`;
  const tags=[];
  if(f.owner)tags.push(`<span class="pill" style="cursor:pointer" onclick="S.filter.owner=null;render()">Rep: ${esc(REP_BY_ID[f.owner].name)} &times;</span>`);
  if(f.terr){const tn=STATE_BY_AB[f.terr]?STATE_BY_AB[f.terr].name:f.terr;tags.push(`<span class="pill" style="cursor:pointer" onclick="S.filter.terr=null;render()">Territory: ${esc(tn)} &times;</span>`);}
  if(tags.length)h+=`<div style="margin:-4px 0 10px;display:flex;gap:6px;flex-wrap:wrap">${tags.join('')}</div>`;
  if(!list.length)h+=`<div class="empty">No units match. Adjust filters or add a company.</div>`;
  else h+=`<div class="grid g2">`+list.map(unitCard).join('')+`</div>`;
  $('#app').innerHTML=h;
  const fq=$('#fq');if(fq){fq.focus();fq.setSelectionRange(fq.value.length,fq.value.length);}
}
let _pt;function debounceP(){clearTimeout(_pt);_pt=setTimeout(render,220);}

/* ---------- unit card ---------- */
function unitCard(c){
  const idx=S.companies.indexOf(c);
  const ind=IND_BY_KEY[c.industry]||{color:'#8c8c8c',icon:'\u{1F9ED}'};
  const rep=REP_BY_ID[c.owner]||REPS[0];
  const rej=c.rejected;const sIdx=STAGE_IDX[c.stage];
  const fillPct=rej?100:((STAGES[sIdx]?STAGES[sIdx].pct:0.3)*100);
  const fillCol=rej?REJ.color:(STAGES[sIdx]?STAGES[sIdx].color:'#5b6b7a');
  const steps=STAGES.map((s,i)=>{const done=!rej&&i<=sIdx;
    return `<div class="step ${done?'done':''}" style="${done?'background:'+s.color+';border-color:transparent':''}" onclick="setStageIdx(${idx},'${s.key}')" title="${s.label}">${s.short}</div>`;}).join('');
  const stageLabel=rej?REJ.label:(STAGES[sIdx]?STAGES[sIdx].label:'');
  const tel=telHref(c.phone);
  const cbits=[];
  if(c.contact)cbits.push(`\u{1F464} ${esc(c.contact)}${c.title?' &middot; '+esc(c.title):''}`);
  if(c.email)cbits.push(`✉️ ${esc(c.email)}`);
  if(c.nextStep)cbits.push(`⏭️ ${esc(c.nextStep)}`);
  const contactLine=cbits.length?`<div class="contactline">${cbits.map(x=>`<span>${x}</span>`).join('')}</div>`:'';
  const hint=(c.phone && String(c.phone).replace(/[\d\s().+\/\-]/g,'').length>2)?`<div class="hint">${esc(c.phone)}</div>`:'';
  const tools=`<div class="uacts2">
    ${tel?`<a class="ib call" href="${tel}" onclick="trackCall(${idx})">\u{1F4DE} Call</a>`:''}
    <button class="ib mail" onclick="openEmail(${idx})">✉️ Email</button>
    <button class="ib edit" onclick="openEdit(${idx})">✎ Edit</button>
  </div>`;
  return `<div class="unit" style="${rej?'border-color:rgba(255,77,79,.4)':''}">
    <div class="u-top"><div style="flex:1">
      <div class="u-nm">${esc(c.name)}</div>
      <div class="u-meta">
        <span class="pill ind" style="background:${ind.color}">${ind.icon} ${esc(c.industry||'')}</span>
        <span class="terrpill">${esc(c.geo.terr)}</span>
        <span class="owner" style="border-color:${rep.color}66;color:${rep.color}" onclick="openOwner(${idx})">${rep.emoji} ${esc(rep.name)}</span>
      </div></div>
      <div style="text-align:right"><div style="font-size:10px;font-weight:800;color:${fillCol}">${stageLabel}</div></div>
    </div>
    ${contactLine}${hint}
    <div class="bar" style="margin-top:9px"><i style="width:${fillPct}%;background:${fillCol}"></i></div>
    <div class="steps">${steps}</div>
    <div class="u-actions">
      ${rej?`<button class="btn adv" onclick="reopen(${idx})">Reopen</button>`
        :`<button class="btn adv" onclick="advance(${idx})">Advance &rarr;</button>
          ${c.stage==='convo'?`<button class="btn win sm" onclick="setStageIdx(${idx},'won')">Win \u{1F3C6}</button>`:''}
          <button class="btn rej sm" onclick="reject(${idx})">Reject</button>`}
    </div>
    ${tools}</div>`;
}
async function setStageIdx(i,key){const c=S.companies[i];if(!c)return;
  const oldIdx=c.rejected?-1:STAGE_IDX[c.stage];const before=repXP(c.owner);const bl=levelInfo(before).level;
  const newIdx=STAGE_IDX[key];const won=key==='won'&&(c.stage!=='won'||c.rejected);
  await writeStage(c,key,false);
  if(newIdx>oldIdx)bumpQuest('advances',1);
  if(won)bumpQuest('wins',1);
  const after=repXP(c.owner);const al=levelInfo(after).level;const rep=REP_BY_ID[c.owner]||REPS[0];
  logAct((won?'Won ':'Advanced ')+c.name);render();
  if(al>bl){celebrate();toast(`⬆️ LEVEL UP! ${rep.name} is now Lv ${al}`);}
  else if(won){celebrate();toast(`\u{1F3C6} ${c.name} CONQUERED!  +${after-before} XP → ${rep.name}`);}
  else toast(`${c.name} → ${statusForStage(key)}  +${Math.max(0,after-before)} XP`);}
async function advance(i){const c=S.companies[i];if(!c)return;const ni=Math.min(STAGES.length-1,STAGE_IDX[c.stage]+1);await setStageIdx(i,STAGES[ni].key);}
async function reject(i){const c=S.companies[i];if(!c)return;await writeStage(c,c.stage,true);logAct('Rejected '+c.name);render();toast(c.name+' marked resisted');}
async function reopen(i){const c=S.companies[i];if(!c)return;await writeStage(c,'reached',false);logAct('Reopened '+c.name);render();toast(c.name+' reopened');}

let _pitch=null;
function openPitch(){
  const rep=REP_BY_ID[S.me]||REPS[0];
  const m=$('#modal');
  m.innerHTML=`<h3>\u{1F3AF} Pitch Meter</h3><div style="font-size:12px;color:var(--dim)">Tap when the marker hits the zone. 5 pitches. Land the gold bullseye for max XP. Training XP levels up <b style="color:${rep.color}">${esc(rep.name)}</b>.</div>
    <div id="pitchStat" style="display:flex;justify-content:space-between;margin-top:14px;font-size:13px;font-weight:800"><span>Pitch <span id="pShot">1</span>/5</span><span>Score <span id="pScore" style="color:var(--teal)">0</span> XP</span></div>
    <div class="pitch-bar" id="pBar" onclick="pitchTap()">
      <div class="pitch-zone" id="pZone"></div><div class="pitch-bull" id="pBull"></div><div class="pitch-marker" id="pMark" style="left:0%"></div></div>
    <div id="pMsg" style="text-align:center;font-size:13px;color:var(--dim);margin-top:10px;min-height:18px"></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="stopPitch();closeModal()">Close</button><button class="btn adv" id="pBtn" onclick="pitchTap()">Lock in</button></div>`;
  $('#modalBg').classList.add('show');
  _pitch={shot:1,score:0,pos:0,dir:1,speed:1.6,running:true,raf:null};
  nextPitch();
}
function nextPitch(){
  if(!_pitch)return;
  const zoneW=18+Math.random()*10, zoneL=8+Math.random()*(74-zoneW);
  _pitch.zoneL=zoneL;_pitch.zoneW=zoneW;_pitch.bullL=zoneL+zoneW/2-3;_pitch.bullW=6;
  _pitch.speed=1.4+_pitch.shot*0.25;_pitch.pos=0;_pitch.dir=1;_pitch.running=true;
  const z=$('#pZone'),b=$('#pBull');if(z){z.style.left=zoneL+'%';z.style.width=zoneW+'%';}if(b){b.style.left=_pitch.bullL+'%';b.style.width=_pitch.bullW+'%';}
  cancelAnimationFrame(_pitch.raf);loopPitch();
}
function loopPitch(){
  if(!_pitch||!_pitch.running)return;
  _pitch.pos+=_pitch.dir*_pitch.speed;
  if(_pitch.pos>=100){_pitch.pos=100;_pitch.dir=-1;}if(_pitch.pos<=0){_pitch.pos=0;_pitch.dir=1;}
  const mk=$('#pMark');if(mk)mk.style.left=_pitch.pos+'%';
  _pitch.raf=requestAnimationFrame(loopPitch);
}
function pitchTap(){
  if(!_pitch||!_pitch.running)return;_pitch.running=false;cancelAnimationFrame(_pitch.raf);
  const p=_pitch.pos;let gain=0,msg='';
  if(p>=_pitch.bullL&&p<=_pitch.bullL+_pitch.bullW){gain=50;msg='\u{1F3AF} BULLSEYE! +50 XP';}
  else if(p>=_pitch.zoneL&&p<=_pitch.zoneL+_pitch.zoneW){gain=25;msg='✅ Solid pitch +25 XP';}
  else{gain=4;msg='\u{1F615} Missed the pocket +4 XP';}
  _pitch.score+=gain;const sc=$('#pScore');if(sc)sc.textContent=_pitch.score;const mg=$('#pMsg');if(mg)mg.textContent=msg;
  if(_pitch.shot>=5){finishPitch();return;}
  _pitch.shot++;const sh=$('#pShot');if(sh)sh.textContent=_pitch.shot;
  setTimeout(()=>{if(_pitch)nextPitch();},700);
}
function finishPitch(){
  const total=_pitch?_pitch.score:0;addTrainingXP(S.me,total);bumpStat(S.me,'games',1);logAct('Trained (Pitch Meter) +'+total+' XP');
  const mg=$('#pMsg');if(mg)mg.innerHTML=`<b style="color:var(--teal)">Session done: +${total} XP</b>`;
  const btn=$('#pBtn');if(btn){btn.textContent='Play again';btn.setAttribute('onclick','openPitch()');}
  if(total>=180)celebrate();stopPitch();render();
}
function stopPitch(){if(_pitch){_pitch.running=false;cancelAnimationFrame(_pitch.raf);}}

/* ---------- celebration ---------- */
(function(){const s=document.createElement('style');s.textContent='@keyframes sqfall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}';document.head.appendChild(s);})();
function celebrate(){try{if(navigator.vibrate)navigator.vibrate([25,35,25]);}catch(e){}
  const cols=['#00e0a4','#2f80ed','#ffd23f','#ff7a45','#b37feb','#22c58b'];
  const box=document.createElement('div');box.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden';
  for(let i=0;i<30;i++){const p=document.createElement('div');const c=cols[i%cols.length];
    p.style.cssText='position:absolute;top:-14px;left:'+(Math.random()*100)+'%;width:'+(6+Math.random()*8)+'px;height:'+(5+Math.random()*7)+'px;background:'+c+';border-radius:2px;animation:sqfall '+(1200+Math.random()*900)+'ms '+(Math.random()*200)+'ms ease-in forwards';
    box.appendChild(p);}
  document.body.appendChild(box);setTimeout(()=>box.remove(),2500);}

/* ---------- backup ---------- */
function exportData(){const keys=['sq_ov_v2','sq_stats','sq_quests','sq_acts','sq_me','sq_repnames'];const dump={};keys.forEach(k=>{try{const v=localStorage.getItem(k);if(v!=null)dump[k]=v;}catch(e){}});
  const blob=new Blob([JSON.stringify(dump)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='seaquest-backup-'+today()+'.json';a.click();toast('\u{1F4BE} Backup downloaded');}
function importData(){const inp=document.createElement('input');inp.type='file';inp.accept='application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);Object.keys(d).forEach(k=>{if(d[k]!=null)localStorage.setItem(k,d[k]);});loadRepNames();S.me=getMe();await reload();closeModal();render();toast('✅ Backup restored');}catch(e){toast('Import failed');}};r.readAsText(f);};inp.click();}

/* ---------- help ---------- */
function openHelp(){
  const m=$('#modal');
  m.innerHTML=`<h3>How the game works</h3>
  <div style="font-size:13px;color:var(--tx);line-height:1.6">
    <p style="margin:8px 0"><b>You conquer territory by contacting companies.</b> Each account is a unit you push through stages: Scouted &rarr; Ready &rarr; Contacted &rarr; Engaged &rarr; Won. Reject turns it red.</p>
    <p style="margin:8px 0"><b>Work the Hit List</b> for your prioritized calls and emails each day. Tap <b style="color:var(--teal)">Call</b> to dial, <b style="color:#8fc0ff">Email</b> for a ready template (or Ask Claude), and <b>Edit</b> to save new contact info.</p>
    <p style="margin:8px 0"><b>You earn XP and level up.</b> +20 make contact, +45 a conversation, +150 a win. Finish <b>Daily Ops</b> quests and play the <b>Pitch Meter</b> for bonus training XP. Keep your streak alive.</p>
    <p style="margin:8px 0"><b>The War Map</b> is the USA by state. Tap a state to see the industry sectors inside and how many targets are still undiscovered. Canada, Mexico and the EU are your frontier.</p>
  </div>
  <div style="display:flex;gap:8px;margin-top:16px"><button class="btn adv" onclick="closeModal()">Got it</button></div>`;
  $('#modalBg').classList.add('show');
}

/* ---------- boot ---------- */
$('#fab').onclick=openAdd;
$('#cloudChip').onclick=openCloud;
$('#modalBg').onclick=e=>{if(e.target===$('#modalBg'))closeModal();};
(async function boot(){
  loadRepNames(); S.me=getMe();
  await initCloud();
  await reload();
  render();
  try{if(!localStorage.getItem('sq_seen')){localStorage.setItem('sq_seen','1');setTimeout(openHelp,700);}}catch(e){}
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
})();
</script>
